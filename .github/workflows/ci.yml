name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  lint-and-unit:
    name: Lint (ESLint TS & JSDoc JS) & Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Strip forbidden ignore comments
        run: node scripts/remove-ignores.js

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Lint JS files via JSDoc & TS files via ESLint
        run: npm run lint

      - name: Audit Keystone context graph
        run: .keystone/bin/keystone stone doctor

      - name: Run Vitest unit & integration tests with coverage
        run: npm run test:unit

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
